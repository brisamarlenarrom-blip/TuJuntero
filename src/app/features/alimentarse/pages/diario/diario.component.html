<button class="btn-volver" (click)="volver()">← Volver</button>

<div class="diario-container">

  

  <button *ngIf="!mostrarForm" mat-raised-button color="primary" (click)="mostrarForm = true">
    + Registrar comida
  </button>

  <mat-card *ngIf="mostrarForm" class="form-card">
    <h3>Registrar comida</h3>
    <form [formGroup]="comidaForm" (ngSubmit)="guardarComida()">
      
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="tipo">
          <mat-option value="desayuno">🌅 Desayuno</mat-option>
          <mat-option value="almuerzo">☀️ Almuerzo</mat-option>
          <mat-option value="merienda">🍪 Merienda</mat-option>
          <mat-option value="cena">🌙 Cena</mat-option>
          <mat-option value="snack">🍎 Snack</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>¿Qué comiste?</mat-label>
        <textarea matInput formControlName="descripcion" placeholder="Ej: Ensalada con pollo y agua" rows="2"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>¿Cómo te sentiste?</mat-label>
        <mat-select formControlName="satisfaccion">
          <mat-option [value]="1">😔 Mal</mat-option>
          <mat-option [value]="2">😐 Regular</mat-option>
          <mat-option [value]="3">🙂 Bien</mat-option>
          <mat-option [value]="4">😊 Muy bien</mat-option>
          <mat-option [value]="5">🤩 Excelente</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="botones-form">
        <button mat-raised-button color="primary" type="submit" [disabled]="comidaForm.invalid">Guardar</button>
        <button mat-button type="button" (click)="mostrarForm = false">Cancelar</button>
      </div>
    </form>
  </mat-card>

  <ui-section-title *ngIf="comidas.length > 0">Comidas de hoy</ui-section-title>

  <ui-card 
    *ngFor="let comida of comidas" 
    [accent]="comida.satisfaccion >= 4 ? 'green' : comida.satisfaccion >= 3 ? 'blue' : 'orange'" 
    [clickable]="true">
    
    <div class="comida-info">
      <p class="comida-tipo">{{ comida.tipo }}</p>
      <p class="comida-desc">{{ comida.descripcion }}</p>
    </div>
    
    <ui-badge [variant]="comida.satisfaccion >= 4 ? 'green' : comida.satisfaccion >= 3 ? 'blue' : 'orange'">
      {{ getEmoji(comida.satisfaccion) }}
    </ui-badge>
    
    <button (click)="eliminarComida(comida.id)" class="btn-eliminar">🗑️</button>
    
  </ui-card>

  <ui-empty-state 
    *ngIf="comidas.length === 0 && !mostrarForm"
    icon="🍽️"
    title="Sin registros hoy"
    text="Registrá tu primera comida del día">
  </ui-empty-state>

</div>
