<form
  class="editar-container"
  (ngSubmit)="guardar()"
  #perfilForm="ngForm">

  <!-- HEADER -->
  <div class="editar-header">
    <button
      type="button"
      class="btn-volver"
      (click)="volver()">
      ←
    </button>

    <h1 class="editar-titulo">Editar perfil</h1>

    <div style="width:40px"></div>
  </div>

  <!-- AVATAR -->
  <div class="avatar-section">
    <div class="avatar-grande">
      {{ iniciales }}
    </div>

    <p class="avatar-hint">
      Tu avatar usa tus iniciales
    </p>
  </div>

  <!-- MENSAJES -->
  <div
    class="mensaje-exito"
    *ngIf="mensajeExito">
    {{ mensajeExito }}
  </div>

  <div
    class="mensaje-error"
    *ngIf="mensajeError">
    {{ mensajeError }}
  </div>

  <!-- DATOS PERSONALES -->
  <section class="seccion-card">

    <h2 class="seccion-titulo">
      👤 Datos personales
    </h2>

    <div class="campo-group">

      <label
        class="campo-label"
        for="nombre">
        Nombre *
      </label>

      <input
        id="nombre"
        name="nombre"
        class="campo-input"
        type="text"
        maxlength="40"
        autocomplete="given-name"
        placeholder="Tu nombre"
        [(ngModel)]="nombre"
        (ngModelChange)="actualizarIniciales()">

    </div>

    <div class="campo-group">

      <label
        class="campo-label"
        for="apellido">
        Apellido *
      </label>

      <input
        id="apellido"
        name="apellido"
        class="campo-input"
        type="text"
        maxlength="40"
        autocomplete="family-name"
        placeholder="Tu apellido"
        [(ngModel)]="apellido"
        (ngModelChange)="actualizarIniciales()">

    </div>

    <div class="campo-group">

      <label
        class="campo-label"
        for="fechaNacimiento">
        Fecha de nacimiento
      </label>

      <input
        id="fechaNacimiento"
        name="fechaNacimiento"
        class="campo-input"
        type="date"
        [max]="fechaMaxima"
        [(ngModel)]="fechaNacimiento">

    </div>

    <div class="campo-group">

      <label
        class="campo-label"
        for="bio">
        Bio
      </label>

      <textarea
        id="bio"
        name="bio"
        class="campo-input campo-textarea"
        rows="3"
        maxlength="250"
        placeholder="Contá algo sobre vos..."
        [(ngModel)]="bio">
      </textarea>

      <div class="contador-bio">
        {{ bio.length }}/250
      </div>

    </div>

  </section>

  <!-- EDUCACIÓN -->
  <section class="seccion-card">

    <h2 class="seccion-titulo">
      📚 Educación
    </h2>

    <div class="campo-group">

      <label
        class="campo-label"
        for="nivelEstudios">
        Nivel de estudios
      </label>

      <select
        id="nivelEstudios"
        name="nivelEstudios"
        class="campo-input campo-select"
        [(ngModel)]="nivelEstudios">

        <option value="">
          Seleccioná una opción
        </option>

        <option
          *ngFor="let nivel of nivelesEstudio"
          [value]="nivel">

          {{ nivel }}

        </option>

      </select>

    </div>

    <div class="campo-group">

      <label
        class="campo-label"
        for="carreraOInteres">
        Carrera o interés
      </label>

      <input
        id="carreraOInteres"
        name="carreraOInteres"
        class="campo-input"
        type="text"
        maxlength="80"
        autocomplete="organization-title"
        placeholder="Ej: Ingeniería, Marketing..."
        [(ngModel)]="carreraOInteres">

    </div>

  </section>

  <!-- TRABAJO -->
  <section class="seccion-card">

    <h2 class="seccion-titulo">
      💼 Trabajo
    </h2>

    <div class="toggle-row">

      <span class="toggle-label">
        ¿Trabajás actualmente?
      </span>

      <div
        class="toggle-btn"
        [class.toggle-on]="trabaja"
        (click)="trabaja = !trabaja; alCambiarSituacionLaboral()">

        <div class="toggle-circle"></div>

      </div>

    </div>

    <div
      class="campo-group"
      *ngIf="trabaja">

      <label
        class="campo-label"
        for="horasTrabajo">

        Horas por día

      </label>

      <input
        id="horasTrabajo"
        name="horasTrabajo"
        class="campo-input"
        type="number"
        min="0"
        max="24"
        [(ngModel)]="horasTrabajoPorDia"
        placeholder="Ej: 8">

    </div>

  </section>

  <!-- DEPORTE -->
  <section class="seccion-card">

    <h2 class="seccion-titulo">
      🏋️ Deporte
    </h2>

    <div class="toggle-row">

      <span class="toggle-label">
        ¿Hacés deporte?
      </span>

      <div
        class="toggle-btn"
        [class.toggle-on]="haceDeporte"
        (click)="haceDeporte = !haceDeporte; alCambiarActividadDeportiva()">

        <div class="toggle-circle"></div>

      </div>

    </div>

    <div *ngIf="haceDeporte">

      <div
        class="campo-group"
        style="margin-top:14px">

        <label
          class="campo-label"
          for="deporte">

          ¿Qué deporte?

        </label>

        <input
          id="deporte"
          name="deporte"
          class="campo-input"
          type="text"
          maxlength="50"
          [(ngModel)]="queDeporte"
          placeholder="Ej: Fútbol, Natación...">

      </div>

      <div
        class="campo-group"
        style="margin-top:14px">

        <label
          class="campo-label"
          for="frecuencia">

          Frecuencia

        </label>

        <select
          id="frecuencia"
          name="frecuencia"
          class="campo-input campo-select"
          [(ngModel)]="frecuenciaDeporte">

          <option value="">
            Seleccioná una opción
          </option>

          <option
            *ngFor="let frecuencia of frecuenciasDeporte"
            [value]="frecuencia">

            {{ frecuencia }}

          </option>

        </select>

      </div>

    </div>

  </section>

  <!-- BOTÓN -->
  <button
    type="submit"
    class="btn-guardar"
    [disabled]="guardando || perfilForm.invalid">

    <span *ngIf="!guardando">
      Guardar cambios ✓
    </span>

    <span *ngIf="guardando">
      Guardando...
    </span>

  </button>

</form>
