<!-- ── BIENESTAR DEL MES ──────────────────────────────── -->
<div class="seccion-card" *ngIf="diasRegistrados > 0">
  <h2 class="seccion-titulo">Tu bienestar este mes</h2>

  <div class="animo-resumen">
    <div class="animo-promedio">
      <span class="animo-emoji-grande">{{ emojiPromedio }}</span>
      <div class="animo-promedio-info">
        <span class="animo-promedio-num">{{ promedioAnimo }}</span>
<span class="animo-promedio-label">{{ getLabelPorValor(promedioAnimo) }} en promedio</span>       
        <span class="animo-dias">{{ diasRegistrados }} días registrados</span>
      </div>
    </div>
  </div>

  <!-- Últimos 7 días -->
  <div class="animo-barras">
    <div class="animo-barra-item" *ngFor="let a of animosMes.slice(-7)">
      <div class="animo-barra-fill"
        [style.height.%]="(a.valor / 5) * 100"
        [style.background-color]="getColorAnimo(a.valor)">
      </div>
      <span class="animo-barra-emoji">{{ a.emoji }}</span>
      <span class="animo-barra-fecha">{{ a.fecha | date:'d/M' }}</span>
    </div>
  </div>
</div>
