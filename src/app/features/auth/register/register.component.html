<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-logo">✨</div>
      <h1 class="auth-titulo">Crear cuenta</h1>
      <p class="auth-subtitulo">Completá tus datos para registrarte</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-row">
        <div class="form-field">
          <label>Nombre</label>
          <input formControlName="nombre" placeholder="Tu nombre">
          <span class="field-error" *ngIf="registerForm.get('nombre')?.touched && registerForm.get('nombre')?.hasError('required')">Requerido</span>
        </div>
        <div class="form-field">
          <label>Apellido</label>
          <input formControlName="apellido" placeholder="Tu apellido">
          <span class="field-error" *ngIf="registerForm.get('apellido')?.touched && registerForm.get('apellido')?.hasError('required')">Requerido</span>
        </div>
      </div>

      <div class="form-field">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="tu@email.com">
        <span class="field-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('required')">Requerido</span>
        <span class="field-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('email')">Email inválido</span>
      </div>

      <div class="form-field">
        <label>Contraseña</label>
        <input formControlName="password" type="password" placeholder="Mínimo 6 caracteres">
        <span class="field-error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('required')">Requerida</span>
        <span class="field-error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</span>
      </div>

      <div class="form-field">
        <label>Fecha de nacimiento</label>
        <input formControlName="fechaNacimiento" type="date">
        <span class="field-error" *ngIf="registerForm.get('fechaNacimiento')?.touched && registerForm.get('fechaNacimiento')?.hasError('required')">Requerida</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="!registerForm.valid">Crear cuenta</button>

    </form>

    <p class="auth-link">¿Ya tenés cuenta? <a routerLink="/auth/login">Iniciar sesión</a></p>

  </div>
</div>
