<!-- Pantalla de registro -->
<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title class="auth-title">Registrarse</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- Formulario reactivo -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <!-- Nombre -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre">
          <mat-error *ngIf="registerForm.get('nombre')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <!-- Apellido -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Apellido</mat-label>
          <input matInput formControlName="apellido">
          <mat-error *ngIf="registerForm.get('apellido')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email">
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Requerido</mat-error>
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <!-- Contraseña -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput formControlName="password" type="password">
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Requerida</mat-error>
          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <!-- Fecha de nacimiento -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fecha de Nacimiento</mat-label>
          <input matInput formControlName="fechaNacimiento" type="date">
          <mat-error *ngIf="registerForm.get('fechaNacimiento')?.hasError('required')">Requerida</mat-error>
        </mat-form-field>

        <!-- Botón enviar -->
        <button mat-raised-button color="primary" type="submit" [disabled]="!registerForm.valid" class="full-width">Crear cuenta</button>
      </form>

      <!-- Link a login -->
      <p class="register-link">¿Ya tenés cuenta? <a routerLink="/auth/login">Iniciar sesión</a></p>
    </mat-card-content>
  </mat-card>
</div>
