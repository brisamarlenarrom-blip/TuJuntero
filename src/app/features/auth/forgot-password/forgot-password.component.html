<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title class="auth-title">Recuperar Contraseña</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      
      <p class="texto">Ingresá tu email y te enviaremos un link para restablecer tu contraseña.</p>
      
      <form [formGroup]="form" (ngSubmit)="enviar()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="tu@email.com">
          <mat-error *ngIf="form.get('email')?.hasError('required')">Email requerido</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <p class="mensaje" *ngIf="mensaje">{{ mensaje }}</p>
        <p class="error-msg" *ngIf="error">{{ error }}</p>

        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || cargando" class="full-width">
          {{ cargando ? 'Enviando...' : 'Enviar link de recuperación' }}
        </button>
      </form>

      <p class="register-link">
        <a routerLink="/auth/login">Volver al login</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
