<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-logo">🔐</div>
      <h1 class="auth-titulo">Recuperar contraseña</h1>
      <p class="auth-subtitulo">
        {{ paso === 1 ? 'Ingresá tu email para buscar tu cuenta' :
           paso === 2 ? '¿Cuál es tu fecha de nacimiento?' :
           'Ingresá tu nueva contraseña' }}
      </p>
    </div>

    <!-- Indicador de pasos -->
    <div class="pasos">
      <div class="paso" [class.paso-activo]="paso >= 1" [class.paso-completo]="paso > 1">1</div>
      <div class="paso-linea" [class.paso-linea-activa]="paso > 1"></div>
      <div class="paso" [class.paso-activo]="paso >= 2" [class.paso-completo]="paso > 2">2</div>
      <div class="paso-linea" [class.paso-linea-activa]="paso > 2"></div>
      <div class="paso" [class.paso-activo]="paso >= 3">3</div>
    </div>

    <form [formGroup]="forgotForm">

      <!-- Paso 1: Email -->
      <div *ngIf="paso === 1">
        <div class="form-field">
          <label>Email</label>
          <input formControlName="email" type="email" placeholder="tu@email.com">
        </div>
        <button type="button" class="btn-primary" (click)="buscarUsuario()" [disabled]="forgotForm.get('email')?.invalid || cargando">
          {{ cargando ? 'Buscando...' : 'Buscar cuenta' }}
        </button>
      </div>

      <!-- Paso 2: Fecha de nacimiento -->
      <div *ngIf="paso === 2">
        <div class="form-field">
          <label>Fecha de nacimiento</label>
          <input formControlName="fechaNacimiento" type="date">
        </div>
        <button type="button" class="btn-primary" (click)="verificarFecha()" [disabled]="cargando">
          {{ cargando ? 'Verificando...' : 'Verificar' }}
        </button>
      </div>

      <!-- Paso 3: Nueva contraseña -->
      <div *ngIf="paso === 3">
        <div class="form-field">
          <label>Nueva contraseña</label>
          <input formControlName="nuevaPassword" type="password" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="button" class="btn-primary" (click)="cambiarPassword()" [disabled]="forgotForm.get('nuevaPassword')?.invalid">
          Cambiar contraseña
        </button>
      </div>

    </form>

    <p class="mensaje-ok" *ngIf="mensaje">✅ {{ mensaje }}</p>
    <p class="error-msg" *ngIf="error">❌ {{ error }}</p>

    <p class="auth-link"><a routerLink="/auth/login">← Volver al login</a></p>

  </div>
</div>
