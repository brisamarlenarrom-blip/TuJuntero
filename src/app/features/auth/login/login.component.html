<div class="auth-container">
  <div class="auth-card">

    <!-- Logo / Header -->
    <div class="auth-header">
      <div class="auth-logo">📖</div>
      <h1 class="auth-titulo">TuJuntero</h1>
      <p class="auth-subtitulo">Iniciá sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-field">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="tu@email.com">
        <span class="field-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">Email requerido</span>
        <span class="field-error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">Email inválido</span>
      </div>

      <div class="form-field">
        <label>Contraseña</label>
        <input formControlName="password" type="password" placeholder="Mínimo 6 caracteres">
        <span class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">Contraseña requerida</span>
        <span class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</span>
      </div>

      <p class="error-msg" *ngIf="error">{{ error }}</p>

      <a class="forgot-link" routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>

      <button type="submit" class="btn-primary" [disabled]="!loginForm.valid">Ingresar</button>

    </form>

    <p class="auth-link">¿No tenés cuenta? <a routerLink="/auth/register">Registrate</a></p>

  </div>
</div>
