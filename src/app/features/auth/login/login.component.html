<div class="auth-container">

  <mat-card class="auth-card">

    <mat-card-content>

      <!-- ==================================================
           ENCABEZADO
           ================================================== -->

      <div class="auth-header">

        <div class="auth-logo" aria-hidden="true">
          📖
        </div>

        <h1 class="auth-titulo">
          TuJuntero
        </h1>

        <p class="auth-subtitulo">
          Iniciá sesión para continuar
        </p>

      </div>

      <!-- ==================================================
           INICIO DE SESIÓN CON GOOGLE
           ================================================== -->

      <button
        mat-raised-button
        type="button"
        class="google-btn full-width"
        [disabled]="cargando"
        (click)="loginWithGoogle()">

        <span class="google-icon" aria-hidden="true">
          G
        </span>

        <span>
          {{ cargando ? 'Procesando...' : 'Ingresar con Google' }}
        </span>

      </button>

      <!-- ==================================================
           SEPARADOR
           ================================================== -->

      <div class="separador">
        <span>o con email</span>
      </div>

      <!-- ==================================================
           FORMULARIO DE LOGIN
           ================================================== -->

      <form
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()"
        novalidate>

        <!-- Email -->

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>Email</mat-label>

          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            autocomplete="email">

          <mat-error
            *ngIf="loginForm.get('email')?.hasError('required')">

            El email es obligatorio.

          </mat-error>

          <mat-error
            *ngIf="loginForm.get('email')?.hasError('email')">

            Ingresá un email válido.

          </mat-error>

        </mat-form-field>

        <!-- Contraseña -->

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>Contraseña</mat-label>

          <input
            matInput
            type="password"
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            autocomplete="current-password">

          <mat-error
            *ngIf="loginForm.get('password')?.hasError('required')">

            La contraseña es obligatoria.

          </mat-error>

          <mat-error
            *ngIf="loginForm.get('password')?.hasError('minlength')">

            La contraseña debe tener al menos 6 caracteres.

          </mat-error>

        </mat-form-field>

        <!-- Mensaje general de error -->

        <p
          class="error-msg"
          *ngIf="error"
          role="alert">

          {{ error }}

        </p>

        <!-- Recuperar contraseña -->

        <p class="register-link forgot-link">

          <a routerLink="/auth/forgot-password">
            ¿Olvidaste tu contraseña?
          </a>

        </p>

        <!-- Botón principal -->

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="btn-primary full-width"
          [disabled]="loginForm.invalid || cargando">

          {{ cargando ? 'Ingresando...' : 'Ingresar' }}

        </button>

      </form>

      <!-- ==================================================
           REGISTRO
           ================================================== -->

      <p class="register-link">

        ¿No tenés cuenta?

        <a routerLink="/auth/register">
          Registrate
        </a>

      </p>

    </mat-card-content>

  </mat-card>

</div>
