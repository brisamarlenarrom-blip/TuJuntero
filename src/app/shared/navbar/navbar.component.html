<div class="navbar">
  <span class="logo">TuJuntero</span>
  <div class="navbar-actions">
    <button class="icon-btn" *ngIf="auth.getIsLogged()">🔔</button>
    <div class="avatar" *ngIf="auth.getIsLogged()">
      {{ nombre?.charAt(0)?.toUpperCase() }}
    </div>
    <button *ngIf="!auth.getIsLogged()" class="login-btn" routerLink="/auth/login">Ingresar</button>
    <button *ngIf="auth.getIsLogged()" class="logout-btn" (click)="logout()">Salir</button>
  </div>
</div>
