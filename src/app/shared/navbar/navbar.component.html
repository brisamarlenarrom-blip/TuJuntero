<nav class="navbar" aria-label="Navegación principal">

  <!-- ==================================================
       SECTOR IZQUIERDO
       ================================================== -->

  <div class="navbar-izq">

    <!-- Flecha para volver -->

    <button
      *ngIf="mostrarFlecha"
      type="button"
      class="btn-volver"
      aria-label="Volver a la pantalla anterior"
      title="Volver"
      (click)="volver()">

      ←

    </button>

    <!-- Logo principal -->

    <a
      *ngIf="!mostrarFlecha"
      class="logo"
      routerLink="/inicio"
      aria-label="Ir al inicio de TuJuntero">

      TuJuntero

    </a>

    <!-- Título de la ruta actual -->

    <span
      *ngIf="mostrarFlecha"
      class="ruta-titulo">

      {{ tituloRuta }}

    </span>

  </div>

  <!-- ==================================================
       SECTOR DERECHO
       ================================================== -->

  <div class="navbar-actions">

    <!-- ------------------------------------------------
         USUARIO NO AUTENTICADO
         ------------------------------------------------ -->

    <a
      *ngIf="!estaLogueado"
      class="login-btn"
      routerLink="/auth/login">

      Ingresar

    </a>

    <!-- ------------------------------------------------
         USUARIO AUTENTICADO
         ------------------------------------------------ -->

    <ng-container *ngIf="estaLogueado">

      <!-- Panel de administración -->

      <a
        *ngIf="esAdmin"
        class="admin-btn"
        routerLink="/admin/mentores"
        title="Administración de usuarios">

        Administrar

      </a>

      <!-- Notificaciones -->

      <button
        type="button"
        class="icon-btn"
        aria-label="Ver notificaciones"
        title="Notificaciones">

        🔔

      </button>

      <!-- Avatar con acceso al perfil -->

      <a
        class="avatar"
        routerLink="/perfil"
        [attr.aria-label]="'Abrir el perfil de ' + nombre"
        [title]="nombre || 'Perfil'">

        {{ nombre.charAt(0).toUpperCase() || 'U' }}

      </a>

      <!-- Cerrar sesión -->

      <button
        type="button"
        class="logout-btn"
        aria-label="Cerrar sesión"
        (click)="logout()">

        Salir

      </button>

    </ng-container>

  </div>

</nav>
